<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job details | Tripura Job Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .back { display: inline-block; color: var(--teal); margin-bottom: 20px; }
  .org { font-size: 19px; margin-top: 6px; }
  .details { margin-top: 28px; border-top: 1px solid var(--line); }
  .details div { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .details dt { font-weight: 600; color: var(--muted); }
  .details dd { white-space: pre-line; }
  .buttons { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn.outline { background: #fff; color: var(--teal); border: 1px solid var(--teal); }
  .btn.outline:hover { background: var(--teal-soft); }
  a.btn { text-decoration: none; display: inline-block; }
  .views-note { margin-top: 18px; font-size: 15px; color: var(--muted); background: var(--teal-soft); padding: 10px 14px; border-radius: 8px; }
  .views-note a { color: var(--teal-deep); font-weight: 600; }
  .locked { margin-top: 28px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 26px; }
  .locked h2 { font-family: Sora, sans-serif; font-size: 20px; color: var(--teal-deep); }
  .locked p { margin-top: 8px; color: var(--muted); }
  @media (max-width: 560px) { .details div { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="jobs.html">Tripura <span>Job Pulse</span></a>
    <a class="header-link" href="profile.html">My profile</a>
  </div>
</header>

<main class="page">
  <a class="back" href="jobs.html">Back to all jobs</a>
  <div id="content"><p class="lead">Loading…</p></div>
</main>

<script src="config.js"></script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  const { SUPABASE_URL, SUPABASE_KEY } = window.TJP_CONFIG;
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const content = document.getElementById("content");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

  const id = new URLSearchParams(location.search).get("id");

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "login.html?next=" + encodeURIComponent("job.html?id=" + id);
    throw new Error("Not signed in");
  }

  function message(text) { content.innerHTML = ""; content.append(el("p", "lead", text)); }
  if (!id) { message("This job link is incomplete. Go back to the job list and choose a job."); throw new Error("No id"); }

  const { data: res, error } = await supabase.rpc("get_job_details", { p_job_id: id });
  if (error) { console.error(error); message("Couldn't load this job. Check your connection and refresh the page."); throw error; }
  if (!res || res.status === "not_found") { message("This job is no longer available. It may have been closed or removed."); throw new Error("Not found"); }

  const job = res.job;
  const summary = res.summary;
  document.title = job.title + " | Tripura Job Pulse";
  content.innerHTML = "";
  content.append(el("h1", "", job.title));
  if (job.organisation) content.append(el("p", "org", job.organisation));

  // ---------- Out of free views ----------
  if (res.status === "locked") {
    const box = el("section", "locked");
    box.append(el("h2", "", "You've used all your free job views"));
    box.append(el("p", "", "Government jobs stay free for everyone. To see full details of more private and remote jobs, choose a plan. Plans start at ₹49 for 20 jobs."));
    const btns = el("div", "buttons");
    const a = el("a", "btn", "See plans"); a.href = "plans.html?back=" + encodeURIComponent(id);
    btns.append(a);
    box.append(btns);
    content.append(box);
    throw new Error("Locked");
  }

  // ---------- Full details ----------
  const prettyDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
  const rows = [
    ["Job type", job.job_type ? job.job_type.charAt(0).toUpperCase() + job.job_type.slice(1) : null],
    ["Location", [job.city, job.state].filter(Boolean).join(", ") || job.location],
    ["Experience", job.experience],
    ["Industry", job.industry],
    ["Qualification", job.qualification],
    ["Vacancies", job.vacancies],
    ["Salary", job.salary],
    ["Age limit", job.age_limit],
    ["Last date", job.last_date ? prettyDate(job.last_date) : null],
    ["How to apply", job.how_to_apply],
    ["Send applications to", /^mailto:/i.test(job.apply_link || "") ? job.apply_link.replace(/^mailto:/i, "") : null],
    ["About the job", job.description]
  ].filter(([, v]) => v);

  const dl = el("dl", "details");
  for (const [label, value] of rows) {
    const div = el("div");
    div.append(el("dt", "", label), el("dd", "", value));
    dl.append(div);
  }
  content.append(dl);

  const buttons = el("div", "buttons");
  const link = (job.apply_link || "").trim();
  if (/^https?:\/\//i.test(link)) {
    const a = el("a", "btn", "Apply on official site");
    a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer";
    buttons.append(a);
  } else if (/^mailto:/i.test(link)) {
    const a = el("a", "btn", "Email your application");
    a.href = link;
    buttons.append(a);
  }
  const cv = el("a", "btn outline", "Build a CV for this job");
  cv.href = "cv.html?job=" + encodeURIComponent(job.id);
  buttons.append(cv);
  content.append(buttons);

  // ---------- How many views are left (private and remote jobs only) ----------
  if (summary && job.job_type !== "government") {
    const note = el("p", "views-note");
    if (summary.unlimited_until) {
      const until = new Date(summary.unlimited_until).toLocaleDateString("en-IN", { day: "numeric", month: "long" });
      note.textContent = "Unlimited plan active until " + until + ".";
    } else {
      const left = summary.left;
      note.textContent = (res.used_credit ? "This used 1 job view. " : "") +
        (left === 0 ? "You have no job views left. " : `You have ${left} job view${left === 1 ? "" : "s"} left. `);
      const a = el("a", "", left <= 2 ? "Get more views" : "See plans");
      a.href = "plans.html";
      note.append(a);
    }
    content.append(note);
  }
</script>
</body>
</html>
